name: Refresh bill data

# Keeps Supabase in step with Congress.gov without anyone having to remember.
# The ingest script is resumable and skips anything fetched in the last 7 days,
# so a daily run cycles through the corpus a slice at a time rather than
# hammering the API with all ~9,800 bills every morning.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (~3am ET)
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Ingest 119th Congress bills
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/ingest-bills.mjs
